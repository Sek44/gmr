<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="description" content="Des petits jeux pour enfants, à jouer sur téléphone, tablette ou ordinateur.">
  <title>GMR — Jeux</title>
  <link rel="stylesheet" href="./shared/site.css">
  <script defer src="./games/catalog.js"></script>
  <script defer src="./shared/game-state.js"></script>
  <script defer src="./shared/home.js"></script>
</head>
<body>
  <main class="page">
    <header class="home-header">
      <div>
        <p class="eyebrow">Mon espace de jeux</p>
        <h1>GMR</h1>
        <p class="subtitle">Choisis un jeu et amuse-toi !</p>
      </div>
      <a class="button button-secondary" href="./scores.html" aria-label="Consulter tous mes scores">Mes scores</a>
    </header>
    <section aria-labelledby="games-title">
      <h2 id="games-title" class="section-title">Les jeux</h2>
      <div id="game-grid" class="game-grid"></div>
      <p id="empty-games" class="empty-state" hidden>Aucun jeu pour le moment. Les premiers jeux arrivent bientôt !</p>
      <noscript>Active JavaScript pour afficher la liste des jeux.</noscript>
    </section>
    <footer class="site-footer">Les parties et les scores sont enregistrés sur cet appareil.</footer>
  </main>
</body>
</html>
