<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fc">
    <meta name="description" content="GMR : des petits jeux amusants à découvrir sur téléphone, tablette et ordinateur.">
    <title>GMR — Jeux</title>
    <link rel="stylesheet" href="./shared/site.css?v=20261114c">
    <script defer src="./games/catalog.js?v=20261114b"></script>
    <script defer src="./shared/game-state.js"></script>
    <script defer src="./shared/play-time.js?v=20261114b"></script>
    <script defer src="./shared/home.js?v=20261114b"></script>
  </head>
  <body class="home-body">
    <main class="page home-page">
      <header class="home-topbar">
        <a class="home-brand" href="./" aria-label="GMR, accueil">
          <span class="home-brand-mark">
            <img src="./shared/themes/classic-play/assets/gamepad.svg" alt="" width="36" height="36">
          </span>
          <span class="home-brand-text"><strong>GMR</strong><small>Le coin des jeux</small></span>
        </a>
        <a class="home-scores-link" href="./scores.html">
          <img src="./shared/themes/classic-play/assets/trophy.svg" alt="" width="24" height="24">
          <span>Mes scores</span>
        </a>
      </header>

      <section class="gmr-daily-panel" aria-labelledby="gmr-daily-title">
        <div class="daily-heading">
          <div class="daily-heading-title">
            <span class="daily-icon"><img src="./shared/themes/classic-play/assets/clock.svg" alt="" width="26" height="26"></span>
            <div>
              <span class="daily-eyebrow">Aujourd’hui</span>
              <h2 id="gmr-daily-title">Ton temps de jeu</h2>
            </div>
          </div>
          <a class="daily-link" href="/xfr1/">
            <span>Gagner du temps</span>
            <img src="./shared/themes/classic-play/assets/arrow-right.svg" alt="" width="17" height="17">
          </a>
        </div>
        <div id="gmr-daily-summary" class="daily-summary" role="status" aria-live="polite"></div>
      </section>

      <section class="home-games" aria-labelledby="games-title">
        <div class="games-heading">
          <div>
            <span class="section-eyebrow">C’est parti !</span>
            <h2 id="games-title">Les jeux</h2>
          </div>
          <p>Choisis ton aventure</p>
        </div>
        <div id="game-grid" class="game-grid"></div>
        <p id="empty-games" class="empty-state" hidden>De nouveaux jeux arrivent bientôt !</p>
        <noscript>Active JavaScript pour afficher la liste des jeux.</noscript>
      </section>

      <footer class="site-footer">Tes parties et tes scores restent enregistrés sur cet appareil.</footer>
    </main>
  </body>
</html>
