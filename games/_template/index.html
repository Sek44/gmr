<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouveau jeu — GMR</title>
  <script>
    // The homepage refresh token is carried in the game URL. Apply the same
    // token to every CSS/JS asset, without changing script execution order.
    (() => {
      const fresh = new URLSearchParams(location.search).get("gmr-refresh")
        || String(Date.now());
      const resources = [
        ["style", "../../shared/site.css"],
        ["script", "../../games/catalog.js"],
        ["script", "../../shared/game-state.js"],
        ["script", "../../shared/scores.js"],
        ["script", "../../shared/play-time.js"],
        ["script", "../../shared/score-view.js"],
        ["script", "./game.js"],
      ];
      for (const [kind, file] of resources) {
        const url = new URL(file, location.href);
        url.searchParams.set("gmr-refresh", fresh);
        if (kind === "style") {
          document.write('<link rel="stylesheet" href="' + url.href + '">');
        } else {
          const attrs = kind === "module" ? 'type="module"' : 'defer';
          document.write('<scr' + 'ipt ' + attrs + ' src="' + url.href +
            '"></scr' + 'ipt>');
        }
      }
    })();
  </script>
</head>
<body>
  <main class="page">
    <nav class="page-header">
      <a class="icon-button" href="../../" aria-label="Accueil">←</a>
      <h1>Nouveau jeu</h1>
      <a class="icon-button" href="../../scores.html?game=game-id&amp;from=game-id" aria-label="Scores">▤</a>
    </nav>
    <section class="panel">
      <h2>Exemple de fonctionnement</h2>
      <p>Ce dossier est un modèle. Remplace ce jeu de démonstration par les règles de ton jeu.</p>
      <p>Points : <strong id="points">0</strong></p>
      <button class="button button-primary" id="add-point" type="button">Ajouter un point</button>
      <button class="button button-secondary" id="finish" type="button">Terminer la partie</button>
      <button class="button button-secondary" id="again" type="button" hidden>Rejouer</button>
      <p id="message" role="status"></p>
    </section>
  </main>
</body>
</html>
